<body>

    <h1>Analisador de Números</h1>

    <div id="adicionar" onclick="adicionar()">
      adicionar
      </div>
    <p></p>
    <div id="resultado" onclick="result()">
      Mostrar resultado
    </div>
    <p></p>
    <div id="lista">
      A lista aparecerá aqui!
    </div>
    <p></p>
    <div id="resultNaTela">
      Clique em "Mostrar resultado" para mostrar os dados na tela
    </div>
  </section>
  
  <footer>
    <p>&copy;Lony_Johns</p>
